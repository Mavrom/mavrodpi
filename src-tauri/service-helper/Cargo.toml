[package]
name = "mavrodpi-service-helper"
version = "0.3.2"
edition = "2021"
publish = false

[[bin]]
name = "mavrodpi-svc"
path = "src/main.rs"

[dependencies]
windows-service = "0.7"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
