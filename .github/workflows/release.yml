name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build service host binary (isolated, no Tauri build.rs)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force svc-build\src | Out-Null
          Copy-Item src-tauri\src\bin\mavrodpi-svc.rs svc-build\src\main.rs
          @"
          [package]
          name = "mavrodpi-svc"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          windows-service = "0.7"
          "@ | Out-File svc-build\Cargo.toml -Encoding utf8
          cd svc-build
          cargo build --release
          cd ..
          New-Item -ItemType Directory -Force src-tauri\resources | Out-Null
          Copy-Item svc-build\target\release\mavrodpi-svc.exe src-tauri\resources\mavrodpi-svc.exe -Force

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MavroDPI ${{ github.ref_name }}"
          releaseBody: "Yeni sürüm çıktı. Uygulama açıkken otomatik güncelleme bildirimi alacaksınız."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
