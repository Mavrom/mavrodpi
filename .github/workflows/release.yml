name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build service host binary
        shell: pwsh
        run: |
          # Tauri build.rs dosyanın var olduğunu kontrol eder — önce placeholder koy
          New-Item -ItemType Directory -Force src-tauri/resources | Out-Null
          [System.IO.File]::WriteAllBytes("src-tauri\resources\mavrodpi-svc.exe", [byte[]]@(0x4D,0x5A))
          # Gerçek binary'yi derle ve üzerine yaz
          cd src-tauri
          cargo build --release --bin mavrodpi-svc
          Copy-Item target\release\mavrodpi-svc.exe resources\mavrodpi-svc.exe -Force

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MavroDPI ${{ github.ref_name }}"
          releaseBody: "Yeni sürüm çıktı. Uygulama açıkken otomatik güncelleme bildirimi alacaksınız."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
